<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal Highway 3D Bus Simulator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <h3 style="color:#f87171; margin-bottom:5px;">🇳🇵 Nepal Bus Simulator 3D</h3>
      <div><b>Route:</b> <span id="route-txt">Kathmandu ➔ Pokhara</span></div>
      <div><b>Current Location:</b> <span id="city-txt">Kathmandu Bus Park</span></div>
      <div><b>Cash:</b> NPR <span id="money-txt" style="color:#4ade80;">1500</span></div>
      <div><b>Passengers:</b> <span id="passengers-txt">0</span> / 32</div>
      <div><b>Door Status:</b> <span id="door-txt" class="status-badge closed">CLOSED</span></div>
      <div><b>Fuel:</b> <span id="fuel-txt">100</span>%</div>
      <div><b>Speed:</b> <span id="speed-txt">0</span> km/h</div>
    </div>
  </div>

  <div id="controls-bar">
    <div class="panel-card">
      <h4>Highway Navigation</h4>
      <select id="route-select">
        <option value="Pokhara">Kathmandu ➔ Pokhara (Prithvi Hwy)</option>
        <option value="Hetauda">Kathmandu ➔ Hetauda (Tribhuvan Hwy)</option>
        <option value="Janakpur">Hetauda ➔ Janakpur (Mahendra Hwy)</option>
        <option value="Malangwa">Janakpur ➔ Malangwa (Terai Route)</option>
      </select>
      <button id="board-btn">Board Passengers at Station</button>
    </div>

    <div class="panel-card">
      <h4>Bus Operations</h4>
      <button id="door-btn">Open/Close Passenger Doors (Space)</button>
      <small style="color:#94a3b8;">Controls: [W/A/S/D] or Arrow Keys to Drive</small>
    </div>
  </div>

<script src="game.js?v=2.0"></script>
</body>
</html>
